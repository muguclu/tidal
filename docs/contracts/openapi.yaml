openapi: 3.1.0
info:
  title: Tidal API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Tidal time-series platform API, v1. This file is the source of truth; the generated FastAPI
    OpenAPI is diffed against it in CI (`oasdiff breaking`). Human-readable counterpart:
    `api-contract.md` (conventions, role matrix, status codes).

    **Base-path convention.** The `/v1` prefix is part of every *path key* below
    (e.g. `/v1/bars`) and the server URL is the bare host (`https://api.tidal.example`).
    This matches the FastAPI router prefix and the paths listed in api-contract.md section 2.

    **Time parameters** (`start`, `end`, `as_of`) accept ISO-8601 UTC (`2020-04-20T00:00:00Z`)
    or an epoch-nanosecond integer passed as a decimal string (`1587340800000000000`).
    Responses always carry both `ts` (ISO-8601 UTC) and `ts_ns` (int64 epoch ns).

    **Roles** (Entra app roles, cumulative): Reader < Trader < Quant; Admin is separate and only
    grants `/v1/admin/*`. Each operation declares the minimum role in `x-tidal-min-role`.

    **Range limits** (SPEC-04 section 3): ticks max 31 days per call; bars with interval `1s`
    max 7 days; `1d` unlimited. Exceeding a limit returns 413.
servers:
  - url: https://api.tidal.example
    description: Base host; every path already includes the /v1 prefix.
security:
  - entra: ["api://tidal/.default"]
tags:
  - name: health
    description: Liveness and readiness (no auth).
  - name: reference
    description: Instrument reference data.
  - name: market-data
    description: Bars, ticks, latest and spreads.
  - name: backtests
    description: Backtest submission and results.
  - name: admin
    description: Operator endpoints.
paths:
  /v1/health/live:
    get:
      tags: [health]
      operationId: getHealthLive
      summary: Liveness probe
      security: []
      x-tidal-min-role: none
      responses:
        "200":
          description: Process is alive.
          headers: { X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" } }
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/health/ready:
    get:
      tags: [health]
      operationId: getHealthReady
      summary: Readiness probe (SQL, Blob, Service Bus reachability)
      security: []
      x-tidal-min-role: none
      responses:
        "200":
          description: All dependencies reachable.
          headers: { X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" } }
          content:
            application/json:
              schema:
                type: object
                required: [status, checks]
                properties:
                  status: { type: string, enum: [ok] }
                  checks:
                    type: object
                    description: Per-dependency result, keys sql, blob, service_bus.
                    additionalProperties: { type: string, enum: [ok] }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/instruments:
    get:
      tags: [reference]
      operationId: listInstruments
      summary: List instruments
      x-tidal-min-role: Reader
      parameters:
        - name: asset_class
          in: query
          schema: { type: string, enum: [crude, gas, power, fx, refined] }
        - name: source
          in: query
          schema: { type: string, enum: [EIA, FRED, SYN] }
      responses:
        "200":
          description: Instruments matching the filters (all if none given).
          headers: { X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" } }
          content:
            application/json: { schema: { $ref: "#/components/schemas/InstrumentList" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/instruments/{id}:
    get:
      tags: [reference]
      operationId: getInstrument
      summary: Get one instrument
      x-tidal-min-role: Reader
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/InstrumentId" }
      responses:
        "200":
          description: The instrument.
          headers: { X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" } }
          content:
            application/json: { schema: { $ref: "#/components/schemas/Instrument" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/bars:
    get:
      tags: [market-data]
      operationId: getBars
      summary: OHLCV bars for one instrument
      description: |
        `fill=ffill` forward-fills gaps in the API layer only (storage never forward-fills).
        `as_of` returns the data as known at that time (restatement-aware, data-contracts section 7).
        `cursor` and `limit` apply to `format=json` only; arrow and parquet stream the whole range.
      x-tidal-min-role: Reader
      parameters:
        - $ref: "#/components/parameters/InstrumentIdQuery"
        - name: interval
          in: query
          required: true
          schema: { $ref: "#/components/schemas/BarInterval" }
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - name: fill
          in: query
          schema: { type: string, enum: [none, ffill], default: none }
        - name: as_of
          in: query
          description: Knowledge-time cutoff, ISO-8601 UTC or epoch-ns integer string.
          schema: { $ref: "#/components/schemas/TimeParam" }
        - $ref: "#/components/parameters/Format"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Bars in the requested format.
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" }
            X-Tidal-Tier: { $ref: "#/components/headers/X-Tidal-Tier" }
          content:
            application/json: { schema: { $ref: "#/components/schemas/BarsResponse" } }
            application/vnd.apache.arrow.stream: { schema: { $ref: "#/components/schemas/BinaryStream" } }
            application/vnd.apache.parquet: { schema: { $ref: "#/components/schemas/BinaryStream" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/ticks:
    get:
      tags: [market-data]
      operationId: getTicks
      summary: Ticks for one instrument (max 31 days per call)
      x-tidal-min-role: Trader
      parameters:
        - $ref: "#/components/parameters/InstrumentIdQuery"
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/Format"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Ticks in the requested format.
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" }
            X-Tidal-Tier: { $ref: "#/components/headers/X-Tidal-Tier" }
          content:
            application/json: { schema: { $ref: "#/components/schemas/TicksResponse" } }
            application/vnd.apache.arrow.stream: { schema: { $ref: "#/components/schemas/BinaryStream" } }
            application/vnd.apache.parquet: { schema: { $ref: "#/components/schemas/BinaryStream" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/latest:
    get:
      tags: [market-data]
      operationId: getLatest
      summary: Last bar per instrument (hot store only)
      x-tidal-min-role: Reader
      x-tidal-open-question: >
        api-contract.md gives no parameters for /latest. Minimal reading: repeatable
        `instrument_id` (required, 1..100) plus optional `interval` (default 1d). The response
        tier is always hot.
      parameters:
        - name: instrument_id
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: { $ref: "#/components/schemas/InstrumentId" }
        - name: interval
          in: query
          schema:
            allOf:
              - $ref: "#/components/schemas/BarInterval"
            default: "1d"
      responses:
        "200":
          description: Latest bar per requested instrument; instruments without data are omitted.
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" }
            X-Tidal-Tier: { $ref: "#/components/headers/X-Tidal-Tier" }
          content:
            application/json: { schema: { $ref: "#/components/schemas/LatestResponse" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/spreads:
    get:
      tags: [market-data]
      operationId: getSpreads
      summary: Spread series leg_a minus leg_b
      description: Timestamps present in both legs only (inner join); no forward-fill.
      x-tidal-min-role: Trader
      x-tidal-open-question: >
        api-contract.md does not define the join semantics, a `format` parameter, or pagination
        for /spreads. Minimal reading: inner join on ts_ns, JSON only, no pagination; the bars
        range limits for the given interval apply (413).
      parameters:
        - name: leg_a
          in: query
          required: true
          schema: { $ref: "#/components/schemas/InstrumentId" }
        - name: leg_b
          in: query
          required: true
          schema: { $ref: "#/components/schemas/InstrumentId" }
        - name: interval
          in: query
          required: true
          schema: { $ref: "#/components/schemas/BarInterval" }
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
      responses:
        "200":
          description: Spread series.
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" }
            X-Tidal-Tier: { $ref: "#/components/headers/X-Tidal-Tier" }
          content:
            application/json: { schema: { $ref: "#/components/schemas/SpreadResponse" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/backtests:
    post:
      tags: [backtests]
      operationId: submitBacktest
      summary: Submit a backtest (optionally a parameter sweep)
      description: |
        Validates, expands `sweep` into child jobs (cartesian product, max 200), writes the parent
        job and enqueues children. `calendar_spread` requires exactly 2 instrument_ids
        (leg_a, leg_b) and params `lookback`, `z_entry`, `z_exit`; other strategies take exactly 1.
        A sweep that expands to more than 200 children returns 413.
      x-tidal-min-role: Quant
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/BacktestRequest" } }
      responses:
        "202":
          description: Accepted and queued.
          headers: { X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" } }
          content:
            application/json: { schema: { $ref: "#/components/schemas/BacktestAccepted" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    get:
      tags: [backtests]
      operationId: listBacktests
      summary: List the own backtest jobs of the caller
      x-tidal-min-role: Quant
      x-tidal-open-question: >
        api-contract.md gives no parameters for the list. Minimal reading: cursor/limit
        pagination, newest first, optional status filter.
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/BacktestJobState" }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The jobs of the caller, with result set to null (fetch a job for its result).
          headers: { X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" } }
          content:
            application/json: { schema: { $ref: "#/components/schemas/BacktestList" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/backtests/{job_id}:
    get:
      tags: [backtests]
      operationId: getBacktest
      summary: Backtest status, with the result when done
      description: Jobs owned by another principal are reported as 404.
      x-tidal-min-role: Quant
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/JobId" }
      responses:
        "200":
          description: Job status.
          headers: { X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" } }
          content:
            application/json: { schema: { $ref: "#/components/schemas/BacktestStatus" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/admin/tiering/run:
    post:
      tags: [admin]
      operationId: runTiering
      summary: Trigger the hot-to-cold migration job (enqueues)
      x-tidal-min-role: Admin
      x-tidal-open-question: >
        api-contract.md defines no request body or response shape. Minimal reading: no body,
        202 with `run_id` and `status=queued`.
      responses:
        "202":
          description: Migration job enqueued.
          headers: { X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" } }
          content:
            application/json: { schema: { $ref: "#/components/schemas/TieringRunAccepted" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/admin/storage/stats:
    get:
      tags: [admin]
      operationId: getStorageStats
      summary: Rows and bytes per tier, from the last stats run
      x-tidal-min-role: Admin
      x-tidal-open-question: >
        api-contract.md defines no response shape. Minimal reading: rows and bytes for hot and
        cold plus the timestamp of the stats run.
      responses:
        "200":
          description: Storage statistics.
          headers: { X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" } }
          content:
            application/json: { schema: { $ref: "#/components/schemas/StorageStats" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
components:
  securitySchemes:
    entra:
      type: oauth2
      description: Entra ID access token, audience api://tidal, roles in the `roles` claim.
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/{tenant}/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/{tenant}/oauth2/v2.0/token
          scopes:
            api://tidal/.default: Access Tidal
  headers:
    X-Correlation-Id:
      description: Request correlation id; echoed from the request if supplied, else generated.
      required: true
      schema: { type: string }
    X-Tidal-Tier:
      description: Storage tier(s) that served the query (used for FinOps cost attribution).
      required: true
      schema: { type: string, enum: [hot, cold, mixed] }
    Retry-After:
      description: Seconds to wait before retrying.
      schema: { type: integer, minimum: 0 }
  parameters:
    InstrumentIdQuery:
      name: instrument_id
      in: query
      required: true
      schema: { $ref: "#/components/schemas/InstrumentId" }
    Start:
      name: start
      in: query
      required: true
      description: Inclusive range start, ISO-8601 UTC or epoch-ns integer string.
      schema: { $ref: "#/components/schemas/TimeParam" }
    End:
      name: end
      in: query
      required: true
      description: Exclusive range end, ISO-8601 UTC or epoch-ns integer string.
      schema: { $ref: "#/components/schemas/TimeParam" }
    Format:
      name: format
      in: query
      schema: { type: string, enum: [json, arrow, parquet], default: json }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `next_cursor`; format=json only.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      description: Rows per page; format=json only.
      schema: { type: integer, minimum: 1, maximum: 100000, default: 10000 }
  responses:
    BadRequest:
      description: Validation error (400).
      headers: { X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" } }
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    Unauthorized:
      description: Missing or invalid token (401).
      headers: { X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" } }
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    Forbidden:
      description: Required role missing (403).
      headers: { X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" } }
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    NotFound:
      description: Unknown instrument or job (404).
      headers: { X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" } }
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    PayloadTooLarge:
      description: Requested range or sweep too large (413).
      headers: { X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" } }
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    TooManyRequests:
      description: Rate limited (429), 60 requests per minute per principal.
      headers:
        X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" }
        Retry-After: { $ref: "#/components/headers/Retry-After" }
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    ServiceUnavailable:
      description: A dependency is down (503).
      headers: { X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" } }
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
  schemas:
    InstrumentId:
      type: string
      pattern: "^[A-Z0-9]+\\.[A-Z0-9_]+\\.[A-Z0-9_]+$"
      examples: [EIA.BRENT.SPOT]
    JobId:
      type: string
      pattern: "^bt_[0-9A-HJKMNP-TV-Z]{26}$"
    TimeParam:
      type: string
      description: ISO-8601 UTC timestamp ending in Z, or epoch nanoseconds as a decimal integer string.
      pattern: "^([0-9]{1,19}|[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z)$"
      examples: ["2020-04-20T00:00:00Z", "1587340800000000000"]
    BarInterval:
      type: string
      enum: ["1s", "1m", "1h", "1d"]
    BinaryStream:
      type: string
      format: binary
      description: Streamed Arrow IPC stream or Parquet file; never fully materialised server-side.
    BacktestJobState:
      type: string
      enum: [queued, running, succeeded, failed, partial]
    Problem:
      type: object
      description: RFC 7807 problem details.
      required: [type, title, status, correlation_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        correlation_id: { type: string }
    Instrument:
      type: object
      description: Reference data, data-contracts section 1.
      required: [instrument_id, source, asset_class, kind, unit, currency, exchange_tz, granularity, description]
      properties:
        instrument_id: { $ref: "#/components/schemas/InstrumentId" }
        source: { type: string, enum: [EIA, FRED, SYN] }
        asset_class: { type: string, enum: [crude, gas, power, fx, refined] }
        kind: { type: string, enum: [spot, future, continuous, fx] }
        unit: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        exchange_tz: { type: string }
        granularity: { type: string, enum: [tick, "1s", "1m", "1h", "1d"] }
        roll_method:
          type: [string, "null"]
          enum: [ratio, difference, none, null]
          description: Required when kind is continuous.
        first_ts_ns: { type: [integer, "null"], format: int64 }
        last_ts_ns: { type: [integer, "null"], format: int64 }
        description: { type: string }
    InstrumentList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Instrument" } }
    Bar:
      type: object
      required: [ts, ts_ns, open, high, low, close, volume, quality, version]
      properties:
        ts: { type: string, format: date-time }
        ts_ns: { type: integer, format: int64 }
        open: { type: number }
        high: { type: number }
        low: { type: number }
        close: { type: number }
        volume:
          type: [number, "null"]
          description: Null when the source has no volume (NaN to null, data-contracts section 3.1).
        quality:
          type: integer
          minimum: 0
          maximum: 31
          description: Bit flags, data-contracts section 5 (bits 0-4).
        version: { type: integer, minimum: 1 }
    BarsResponse:
      type: object
      required: [instrument_id, interval, tier, rows, next_cursor]
      properties:
        instrument_id: { $ref: "#/components/schemas/InstrumentId" }
        interval: { $ref: "#/components/schemas/BarInterval" }
        tier: { type: string, enum: [hot, cold, mixed] }
        rows: { type: array, items: { $ref: "#/components/schemas/Bar" } }
        next_cursor: { type: [string, "null"] }
    Tick:
      type: object
      description: data-contracts section 2 (internal columns omitted).
      required: [ts, ts_ns, price, size, side, quality, version]
      properties:
        ts: { type: string, format: date-time }
        ts_ns: { type: integer, format: int64 }
        price: { type: number }
        size: { type: number, minimum: 0 }
        side: { type: integer, enum: [0, 1, 2], description: "0=trade, 1=bid, 2=ask" }
        quality: { type: integer, minimum: 0, maximum: 31 }
        version: { type: integer, minimum: 1 }
    TicksResponse:
      type: object
      required: [instrument_id, tier, rows, next_cursor]
      properties:
        instrument_id: { $ref: "#/components/schemas/InstrumentId" }
        tier: { type: string, enum: [hot, cold, mixed] }
        rows: { type: array, items: { $ref: "#/components/schemas/Tick" } }
        next_cursor: { type: [string, "null"] }
    LatestBar:
      type: object
      required: [instrument_id, interval, bar]
      properties:
        instrument_id: { $ref: "#/components/schemas/InstrumentId" }
        interval: { $ref: "#/components/schemas/BarInterval" }
        bar: { $ref: "#/components/schemas/Bar" }
    LatestResponse:
      type: object
      required: [tier, rows]
      properties:
        tier: { type: string, enum: [hot] }
        rows: { type: array, items: { $ref: "#/components/schemas/LatestBar" } }
    SpreadPoint:
      type: object
      description: One timestamp where both legs have a bar; spread is leg_a close minus leg_b close.
      required: [ts, ts_ns, leg_a, leg_b, spread]
      properties:
        ts: { type: string, format: date-time }
        ts_ns: { type: integer, format: int64 }
        leg_a: { type: number }
        leg_b: { type: number }
        spread: { type: number }
    SpreadResponse:
      type: object
      required: [leg_a, leg_b, interval, tier, rows]
      properties:
        leg_a: { $ref: "#/components/schemas/InstrumentId" }
        leg_b: { $ref: "#/components/schemas/InstrumentId" }
        interval: { $ref: "#/components/schemas/BarInterval" }
        tier: { type: string, enum: [hot, cold, mixed] }
        rows: { type: array, items: { $ref: "#/components/schemas/SpreadPoint" } }
    BacktestCosts:
      type: object
      required: [fee_bps, slippage_bps]
      properties:
        fee_bps: { type: number, minimum: 0 }
        slippage_bps: { type: number, minimum: 0 }
    BacktestRequest:
      type: object
      required: [strategy, instrument_ids, interval, start, end, params, costs, seed]
      properties:
        strategy: { type: string, enum: [ma_crossover, mean_reversion, calendar_spread] }
        instrument_ids:
          type: array
          minItems: 1
          maxItems: 2
          items: { $ref: "#/components/schemas/InstrumentId" }
          description: Exactly 1 for ma_crossover and mean_reversion; exactly 2 (leg_a, leg_b) for calendar_spread.
        interval: { type: string, enum: ["1m", "1h", "1d"] }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        params:
          type: object
          description: "Strategy parameters, e.g. fast and slow; calendar_spread takes lookback, z_entry, z_exit."
          additionalProperties: { type: number }
        costs: { $ref: "#/components/schemas/BacktestCosts" }
        seed:
          type: integer
          description: Recorded and hashed into result_sha256; v1 strategies are fully deterministic.
        sweep:
          type: object
          description: Optional; cartesian product fans out to child jobs (max 200 in total).
          additionalProperties: { type: array, items: { type: number }, maxItems: 20 }
    BacktestAccepted:
      type: object
      required: [job_id, status]
      properties:
        job_id: { $ref: "#/components/schemas/JobId" }
        status: { type: string, enum: [queued] }
    BacktestChildren:
      type: object
      required: [total, succeeded, failed]
      properties:
        total: { type: integer, minimum: 0 }
        succeeded: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
    BacktestMetrics:
      type: object
      required: [cagr, ann_vol, sharpe, max_drawdown, hit_rate, turnover, n_trades]
      properties:
        cagr: { type: number }
        ann_vol: { type: number }
        sharpe: { type: number }
        max_drawdown: { type: number }
        hit_rate: { type: number }
        turnover: { type: number }
        n_trades: { type: integer, minimum: 0 }
    BacktestResult:
      type: object
      required: [metrics, equity_url, trades_url, result_sha256]
      properties:
        metrics: { $ref: "#/components/schemas/BacktestMetrics" }
        equity_url: { type: string, description: "Blob path, e.g. backtests/bt_.../equity.parquet" }
        trades_url: { type: string }
        result_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
    BacktestStatus:
      type: object
      required: [job_id, status, children, submitted_at, finished_at, result]
      properties:
        job_id: { $ref: "#/components/schemas/JobId" }
        status: { $ref: "#/components/schemas/BacktestJobState" }
        children: { $ref: "#/components/schemas/BacktestChildren" }
        submitted_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        result:
          oneOf:
            - $ref: "#/components/schemas/BacktestResult"
            - type: "null"
    BacktestList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/BacktestStatus" } }
        next_cursor: { type: [string, "null"] }
    TieringRunAccepted:
      type: object
      required: [run_id, status]
      properties:
        run_id: { type: string }
        status: { type: string, enum: [queued] }
    StorageStats:
      type: object
      required: [as_of, hot, cold]
      properties:
        as_of: { type: string, format: date-time, description: Time of the last stats run. }
        hot:
          type: object
          required: [rows, bytes]
          properties:
            rows: { type: integer, minimum: 0 }
            bytes: { type: integer, minimum: 0 }
        cold:
          type: object
          required: [rows, bytes]
          properties:
            rows: { type: integer, minimum: 0 }
            bytes: { type: integer, minimum: 0 }
