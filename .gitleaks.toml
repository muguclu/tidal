# gitleaks config: default rules + a narrow allowlist for publicly documented emulator values.
# Only exact, well-known strings are allowed; any other key-like value still fails the scan.
[extend]
useDefault = true

[allowlist]
description = "Public, machine-independent local emulator credentials (Azurite, Service Bus emulator)"
regexTarget = "match"
# Generated snapshot of public Azure retail prices (T-501): `key:` fields trip generic-api-key.
paths = ['''(^|/)docs/finops/prices\.yaml$''']  # also matches dir-mode scans
regexes = [
  # Azurite devstoreaccount1 key, published in the Azurite docs; works only against a local emulator.
  '''Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==?''',
  # Service Bus emulator literal placeholder key.
  '''SharedAccessKey=SAS_KEY_VALUE''',
  # Fingerprint of Microsoft's public packages signing key (verified in .github/workflows/integration.yml).
  '''BC528686B50D79E339D3721CEB3E94ADBE1229CF''',
  # Test sentinel from an earlier T-303 commit (tests/unit/worker); not a credential.
  '''SENTINEL-sk-12345''',
]
