# T-405: weekly, grouped minor/patch updates, with a 7-day cooldown so a freshly published (possibly
# compromised) release is not picked up immediately. Security updates also need "Dependabot security
# updates" enabled in the repository settings.
# The "uv" ecosystem updates pyproject.toml and uv.lock together. Image digests in
# .github/workflows/integration.yml and tests/integration/images.py are bumped by hand alongside compose.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday}
    cooldown: {default-days: 7}
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies]
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule: {interval: weekly, day: monday}
    cooldown: {default-days: 7}
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies]
  - package-ecosystem: docker-compose
    directory: /
    schedule: {interval: weekly, day: monday}
    cooldown: {default-days: 7}
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies]
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly, day: monday}
    cooldown: {default-days: 7}
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies]
