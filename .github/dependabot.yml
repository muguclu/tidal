# T-405: weekly, grouped minor/patch updates. Security updates are raised separately by GitHub.
# The "uv" ecosystem updates pyproject.toml and uv.lock together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday}
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies]
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule: {interval: weekly, day: monday}
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies]
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly, day: monday}
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies]
