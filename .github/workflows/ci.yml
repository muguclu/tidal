name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # weekly full-history secrets scan
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  lint:
    name: lint
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version-file: .python-version
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: make lint

  types:
    name: types
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version-file: .python-version
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: make types

  tests:
    name: tests
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version-file: .python-version
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      # The 85 % gate is enforced once, in the coverage job.
      - run: uv run pytest -m "not integration" --cov --cov-fail-under=0
      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: coverage
    needs: tests
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version-file: .python-version
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-data
      - name: Enforce coverage gate (fail_under in pyproject.toml)
        run: uv run coverage report
      - run: uv run coverage xml
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists PR commits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }} # built-in job token, not a repository secret

  contracts:
    name: contracts
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version-file: .python-version
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: Run contract tests
        # Exit code 5 (no tests collected) is success until T-003 adds tests/contract.
        # A missing directory is handled the same way (pytest would exit 4).
        run: |
          if [ ! -d tests/contract ]; then
            echo "::notice::tests/contract does not exist yet; nothing to run"
            exit 0
          fi
          rc=0
          uv run pytest tests/contract --no-cov || rc=$?
          if [ "$rc" -eq 5 ]; then
            echo "::notice::no contract tests collected; treating pytest exit code 5 as success"
            exit 0
          fi
          exit "$rc"

  openapi-diff:
    name: openapi-diff
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Lint OpenAPI contract
        run: npx --yes @redocly/cli@2.67.1 lint docs/contracts/openapi.yaml
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version-file: .python-version
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: Export the generated OpenAPI
        run: uv run python scripts/export_openapi.py "$RUNNER_TEMP/generated-openapi.json"
      # Breaking-change diff in BOTH directions (SPEC-04 section 4): contract -> generated and
      # generated -> contract, failing on warnings too. The contract describes every v1 route but
      # the app only implements some of them yet (T-111 adds the read routers), so both diffs are
      # restricted with --match-path to the paths present in the generated document. The filter is
      # derived, not hand-written: each router that lands is compared automatically, and a route
      # missing from the app is caught by tests/contract once all routers exist. Pinned image
      # (tag + digest) keeps the verdict reproducible. oasdiff >= 1.34 is needed for OpenAPI 3.1.
      - name: Breaking-change diff with oasdiff (both directions)
        env:
          OASDIFF_IMAGE: tufin/oasdiff:v1.34.1@sha256:67a23cfea7d251e2ae34ee703ac8733c5d96bc2e7b90fd0f4d475ec99367b85f
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/generated-openapi.json" generated-openapi.json
          paths="$(python3 -c 'import json,re;print("^(" + "|".join(re.escape(p) for p in json.load(open("generated-openapi.json"))["paths"]) + ")$")')"
          echo "comparing paths: $paths"
          rc=0
          for pair in "docs/contracts/openapi.yaml generated-openapi.json" "generated-openapi.json docs/contracts/openapi.yaml"; do
            set -- $pair
            echo "::group::oasdiff breaking $1 -> $2"
            docker run --rm -v "$PWD:/w" -w /w "$OASDIFF_IMAGE" breaking "$1" "$2" --match-path "$paths" --fail-on WARN || rc=1
            echo "::endgroup::"
          done
          exit "$rc"
