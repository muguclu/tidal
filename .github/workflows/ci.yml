name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version-file: .python-version
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: make lint

  types:
    name: types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version-file: .python-version
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: make types

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version-file: .python-version
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      # Fast tests; the 85 % gate is fail_under in pyproject.toml.
      - run: make test
      - name: Write coverage.xml
        run: uv run coverage xml
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists PR commits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }} # built-in job token, not a repository secret

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version-file: .python-version
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: Run contract tests
        # Exit code 5 (no tests collected) is success until T-003 adds tests/contract.
        # A missing directory is handled the same way (pytest would exit 4).
        run: |
          if [ ! -d tests/contract ]; then
            echo "::notice::tests/contract does not exist yet; nothing to run"
            exit 0
          fi
          rc=0
          uv run pytest tests/contract --no-cov || rc=$?
          if [ "$rc" -eq 5 ]; then
            echo "::notice::no contract tests collected; treating pytest exit code 5 as success"
            exit 0
          fi
          exit "$rc"

  openapi-diff:
    name: openapi-diff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint OpenAPI contract
        run: npx --yes @redocly/cli lint docs/contracts/openapi.yaml
      # wired in T-110
      - name: Breaking-change diff with oasdiff (placeholder)
        if: hashFiles('src/tidal/api/app.py') != ''
        run: echo "oasdiff breaking-change check is wired in T-110"
