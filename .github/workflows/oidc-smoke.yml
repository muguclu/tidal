name: oidc-smoke

# Manual check that GitHub OIDC -> Entra (sp-tidal-ci) works. T-008, NEEDS-CLOUD.
# Requires repository variables AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# (variables, not secrets: none of them is confidential) and the GitHub environment "dev".

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: oidc-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Show account
        run: az account show --query "{subscription:id, tenant:tenantId, user:user.name, type:user.type}" -o table
