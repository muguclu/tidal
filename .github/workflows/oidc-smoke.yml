name: oidc-smoke

# Manual check that GitHub OIDC -> Entra (sp-tidal-ci) works. T-008, NEEDS-CLOUD.
# Requires repository variables AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# (variables, not secrets: none of them is confidential) and the GitHub environment "dev".

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: oidc-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          # sp-tidal-ci has no subscription/RG role until later tasks; login must still succeed.
          allow-no-subscriptions: true

      - name: Show account
        # Public repo: never print subscription, tenant or principal IDs (ADR-0008 R-29).
        run: az account show --query "{state:state, type:user.type}" -o table
