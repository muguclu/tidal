apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "tidal.labels" . | nindent 4 }}
    azure.workload.identity/use: "true"
  annotations:
    azure.workload.identity/client-id: {{ required "serviceAccount.clientId is required" .Values.serviceAccount.clientId | quote }}
    azure.workload.identity/tenant-id: {{ required "serviceAccount.tenantId is required" .Values.serviceAccount.tenantId | quote }}
automountServiceAccountToken: false
